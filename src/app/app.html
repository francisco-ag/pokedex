<main class="pagina">
  <section class="ipod">

    <div class="pantalla">

      <header class="barra-superior">
        <span>◀ PokéMusic</span>
        <span>🔋</span>
      </header>

      <section class="contenido">
        @if (vistaActual === 'pokemon') {
          <app-pokemon />
        }

        @if (vistaActual === 'musica') {
          <app-musica />
        }
      </section>

      <footer class="barra-inferior">
        <span>MENU</span>
        <span>
          {{ vistaActual === 'pokemon' ? 'POKÉDEX' : 'MÚSICA' }}
        </span>
      </footer>

    </div>

    <nav class="rueda" aria-label="Controles del iPod">

      <button
        class="control menu"
        type="button"
        (click)="cambiarVista('pokemon')"
      >
        MENU
      </button>

      <button
        class="control anterior"
        type="button"
        aria-label="Ir a Pokédex"
        (click)="cambiarVista('pokemon')"
      >
        ◀
      </button>

      <button
        class="control siguiente"
        type="button"
        aria-label="Ir a música"
        (click)="cambiarVista('musica')"
      >
        ▶
      </button>

      <button
        class="control reproducir"
        type="button"
        aria-label="Abrir música"
        (click)="cambiarVista('musica')"
      >
        ▶❚❚
      </button>

      <button
        class="centro"
        type="button"
        aria-label="Abrir Pokédex"
        (click)="cambiarVista('pokemon')"
      >
        OK
      </button>

    </nav>

  </section>
</main>
