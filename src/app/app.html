
<main class="pagina">
  <section class="ipod">

    <div class="pantalla">

      <header class="barra-superior">
        <span>◀ PokéMusic</span>
        <span>🔋</span>
      </header>

      <section class="contenido">

        @if (menuAbierto) {
          <section class="menu-vistas">
            <h2>Menú principal</h2>

            <p class="instruccion">
              Usa ◀ y ▶ para navegar
            </p>

            <div class="lista-vistas">
              @for (vista of vistas; track vista.id; let i = $index) {
                <button
                  type="button"
                  class="opcion-vista"
                  [class.seleccionada]="i === indiceSeleccionado"
                  (click)="indiceSeleccionado = i; confirmarSeleccion()"
                >
                  <span>{{ i === indiceSeleccionado ? '▶' : ' ' }}</span>
                  {{ vista.nombre }}
                </button>
              }
            </div>

            <p class="ayuda-menu">
              Presiona OK para entrar
            </p>
          </section>
        } @else {
          <ng-container
            [ngComponentOutlet]="componenteActual"
          />
        }

      </section>

      <footer class="barra-inferior">
        <span (click)="irAlMenu()">MENU</span>
        <span>
          {{ menuAbierto ? 'VISTAS' : nombreVistaActual }}
        </span>
      </footer>

    </div>

    <nav class="rueda" aria-label="Controles del iPod">

      <button
        class="control menu"
        type="button"
        (click)="alternarMenu()"
      >
        MENU
      </button>

      <button
        class="control anterior"
        type="button"
        aria-label="Anterior"
        (click)="moverSeleccion(-1)"
      >
        ◀
      </button>

      <button
        class="control siguiente"
        type="button"
        aria-label="Siguiente"
        (click)="moverSeleccion(1)"
      >
        ▶
      </button>

      <button
        class="control reproducir"
        type="button"
        aria-label="Abrir menú"
        (click)="alternarMenu()"
      >
        ▶❚❚
      </button>

      <button
        class="centro"
        type="button"
        aria-label="Aceptar selección"
        (click)="confirmarSeleccion()"
      >
        OK
      </button>

    </nav>

  </section>
</main>
